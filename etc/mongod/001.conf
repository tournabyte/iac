processManagement:
  fork: false
net:
  bindIp: localhost,infra-dev-001.mongodb.tournabyte.com,mongodb01
  port: 27017
security:
  authorization: "enabled"
  keyFile: "/run/secrets/mongo_cluster_keyfile"
replication:
  replSetName: "infra-dev"
setParameter:
  enableLocalhostAuthBypass: false
storage:
  dbPath: "/data/db"
  directoryPerDB: true
  engine: "wiredTiger"
